name: ArcadeManager Windows

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    defaults:
      run:
        working-directory: ./src

    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    # Install the NodeJS workload
    - name: Setup Node.js environment
      uses: actions/setup-node@v4.1.0
      with:
        node-version: 22.x

    # Setup the test coverage
    - name: Setup coverage
      run: dotnet tool install --global dotnet-coverage

    # Restore Nuget packages
    - name: Restore dependencies
      run: dotnet restore

    # Build the project
    - name: Build
      run: dotnet build -c Release --no-restore -p:SixLaborsLicenseKey=$($env:SIXLABOR_LICENCE.Replace(';', '%253B'))
      with:
        SIXLABOR_LICENCE: ${{ secrets.SIXLABOR_LICENCE }}

    # Run the tests and collect the coverage
    - name: Test
      run: dotnet-coverage collect "dotnet test" -f xml -o "coverage.xml"

    # Publish and package the app
    - name: Publish
      run: dotnet publish -p:PublishProfile=win-x64 --no-build -c Release -r win-x64
      working-directory: ./src/ArcadeManager

    # Upload the binaries of the GUI app
    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: ArcadeManager-win
        path: ./src/ArcadeManager/publish/Release/net10.0/win-x64/*.*

    # Upload the binaries of the console app
    - name: Upload console binaries
      uses: actions/upload-artifact@v4
      with:
        name: ArcadeManager-win-console
        path: ./src/ArcadeManager.Console/bin/Release/net10.0/*.*
